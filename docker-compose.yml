---
services:
    pxls-backend:
        build:
            dockerfile: Dockerfile
            context: ./backend/Pxls
        restart: unless-stopped
        environment:
            DATABASE_USER: "pxls"
            DATABASE_PASSWORD: "ChAnGeMeAtYoUrEaRlIeStCoNvEnIeNcE"
            DATABASE_NAME: "pxls"
            DATABASE_HOST: "pxls-database"
            PXLS_HOST: "pixels.stellers.gay"
        volumes:
            - ./data:/data
        tty: true
        stdin_open: true
        depends_on:
            pxls-database:
                condition: service_healthy
                restart: true

    pxls-frontend:
        build:
            dockerfile: Dockerfile
            context: ./frontend
        restart: unless-stopped
        volumes:
            - ./views:/frontend/views
        ports:
            - "3000:3000"
        depends_on:
            pxls-backend:
                #condition: service_healthy
                condition: service_started
                restart: true

    pxls-database:
        image: postgres
        restart: unless-stopped
        command: postgres -c 'max_connections=250'
        environment:
            POSTGRES_USER: "pxls"
            POSTGRES_PASSWORD: "ChAnGeMeAtYoUrEaRlIeStCoNvEnIeNcE"
            POSTGRES_DB: "pxls"
        volumes:
            - pxls-database:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready", "-d", "pxls"]
            interval: 30s
            timeout: 60s
            retries: 5
            start_period: 80s

    pxls-admin:
        build:
            dockerfile: Dockerfile
            context: ./frontend/PxlsAdmin
        restart: unless-stopped
        ports:
            - "8080:80"
        depends_on:
            pxls-database:
                condition: service_healthy
                restart: true
        volumes:
            - ./data:/data

    pxls-stats:
        build:
            dockerfile: Dockerfile
            context: ./frontend/PxlsStats
        restart: unless-stopped
        ports:
            - "8081:80"
        depends_on:
            pxls-database:
                condition: service_healthy
                restart: true

volumes:
    pxls-database: {}
    pxls-backend: {}

